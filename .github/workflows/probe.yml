name: Probe

# Décrit les pages des 4 sites (boutons, champs, appels réseau) pour pouvoir écrire ou réparer
# les modules de wikitcg_bot/sites/. À lancer à la main.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      WIKIMASTERS_STORAGE_STATE: ${{ secrets.WIKIMASTERS_STORAGE_STATE }}
      WIKIGACHA_STORAGE_STATE: ${{ secrets.WIKIGACHA_STORAGE_STATE }}
      WIKI_TCG_COM_STORAGE_STATE: ${{ secrets.WIKI_TCG_COM_STORAGE_STATE }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt && python -m playwright install --with-deps chromium
      # Captures d'écran seulement si le dépôt est privé : elles peuvent montrer un compte connecté.
      - run: python -m wikitcg_bot.probe ${{ github.event.repository.private && '--screenshots' || '' }}
      - uses: actions/upload-artifact@v4
        if: github.event.repository.private
        with:
          name: probe-output
          path: probe-output/
          if-no-files-found: ignore
          retention-days: 3
